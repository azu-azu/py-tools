[default]
# folder = C:\Users\you\data
# file = sample.csv  # filename only → folder と結合。フルパスなら folder を無視
#                    # 空 or 未指定なら folder 内で1番新しい .csv を自動で選ぶ
# display_rows = 30
# latest_by = mtime  # 自動選択の基準: mtime（更新日時・デフォルト） / name（ファイル名順）

[columns]
# 表示する列名をカンマ区切りで指定（曖昧検索）
# names = 名前, date, 金額

[filter]
# 列名は完全一致、値は部分一致（含まれていればマッチ）
# status = 完了
# 空欄フィルタ（空文字列 or null-like 両方にマッチ）:
# status =
